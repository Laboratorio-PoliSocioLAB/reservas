    <ellipse cx="230" cy="120" rx="88" ry="44" fill="#F4F5F7"/>
    <!-- 4 puestos de micrófono -->
    <circle cx="176" cy="74" r="10" fill="#FFFFFF"/>
    <circle cx="284" cy="74" r="10" fill="#FFFFFF"/>
    <circle cx="176" cy="166" r="10" fill="#FFFFFF"/>
    <circle cx="284" cy="166" r="10" fill="#FFFFFF"/>
    <!-- Consola de control -->
    <rect x="434" y="72" width="96" height="96" rx="3" fill="#F4F5F7"/>
    <line x1="454" y1="96" x2="510" y2="96" stroke="#B84408"/>
    <line x1="454" y1="116" x2="510" y2="116" stroke="#B84408"/>
    <line x1="454" y1="136" x2="510" y2="136"/>
    <circle cx="482" cy="152" r="5" fill="#0E6A52" stroke="#0E6A52"/>
  </g>
  <g fill="#B84408">
    <circle cx="198" cy="108" r="4"/>
    <circle cx="262" cy="108" r="4"/>
    <circle cx="198" cy="132" r="4"/>
    <circle cx="262" cy="132" r="4"/>
  </g>
</svg>
