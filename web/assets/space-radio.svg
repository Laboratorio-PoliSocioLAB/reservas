<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 240" role="img" aria-label="Esquema arquitectónico del Laboratorio de radio">
  <rect width="640" height="240" fill="#F4F5F7"/>
  <g stroke="#DDE1E8" stroke-width="1">
    <path d="M0 40H640M0 80H640M0 120H640M0 160H640M0 200H640"/>
    <path d="M80 0V240M160 0V240M240 0V240M320 0V240M400 0V240M480 0V240M560 0V240"/>
  </g>
  <!-- Cabina de locución y control técnico -->
  <g fill="none" stroke="#171B20" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
    <rect x="64" y="32" width="512" height="176" rx="4" fill="#FFFFFF"/>
    <line x1="396" y1="32" x2="396" y2="208"/>
    <!-- Ventana acústica entre locutorio y control -->
    <line x1="396" y1="74" x2="396" y2="166" stroke="#B84408" stroke-width="4"/>
